[project]
name = "agent-workflow-factory"
version = "0.9.0"
description = "Compile business language into governed Agent Graph and BPMN views"
requires-python = ">=3.11"
dependencies = ["cryptography>=45,<51"]

[project.optional-dependencies]
deepseek = ["deepseek-harness-sdk==0.1.1rc1"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
line-length = 100
target-version = "py311"
