name: Workflow Factory CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdk-contract:
    name: Pinned SDK contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      AWF_SDK_RUNTIME_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SDK and native runtime
        run: python -m pip install -e ".[deepseek]"
      - name: Verify resolved composition and local model contract
        run: python -m unittest discover -s tests -p test_harness_sdk_contract.py -v
      - name: Verify signed graph execution and cross-process recovery
        run: python -m unittest discover -s tests -p test_deepseek_harness.py -v
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Verify shared system definition
        run: python scripts/verify_system_definition.py
      - name: Compare canonical Registry definition
        run: |
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/224040010-cpu/skill-registory/master/contracts/system-definition.json \
            --output /tmp/canonical-system-definition.json
          python scripts/verify_system_definition.py \
            --peer /tmp/canonical-system-definition.json
      - name: Compile and validate example
        run: python scripts/run_example.py
      - name: Build business text into BPMN, Graph and SVG
        run: python scripts/run_text_example.py
      - name: Execute and replay reference runtime
        run: python scripts/run_runtime_example.py
      - name: Execute DeepSeek read-only contract MVP
        run: python scripts/run_deepseek_mvp.py
      - name: Execute DeepSeek read-only multinode MVP
        run: python scripts/run_deepseek_multinode_mvp.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
